<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerca sense resultats · F3-Evolt</title>
<style>
:root{
  --color-bg:#f7f9fc;
  --color-surface:#ffffff;
  --color-text:#1a2233;
  --color-muted:#6c7a96;
  --color-border:#e6ebf4;
  --color-primary:#4f46e5;
  --color-income:#16a34a;
  --color-error:#dc2626;
  --radius:0.75rem;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--color-bg);
  color:var(--color-text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
}
/* --- Pantalla 390x844 --- */
.screen{
  width:390px;
  height:844px;
  background:var(--color-bg);
  overflow:hidden;
  margin:0 auto;
  position:relative;
}
/* --- Barra superior --- */
.appbar{
  background:var(--color-surface);
  border-bottom:1px solid var(--color-border);
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:8px;
}
.appbar-title{
  font-size:17px;
  font-weight:600;
}
.appbar-back{
  display:inline-flex;
  align-items:center;
  gap:4px;
  color:var(--color-primary);
  font-size:15px;
  font-weight:500;
  text-decoration:none;
}
/* --- Contingut --- */
.content{
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.card{
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:var(--radius);
  padding:16px;
}
/* --- Barra de cerca --- */
/* <!-- TODO: classe pendent a base.css --> */
.searchbar{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--color-surface);
  border:1px solid var(--color-primary);
  border-radius:var(--radius);
  padding:12px 16px;
  font-size:16px;
  box-shadow:0 0 0 3px #4f46e51a;
}
/* <!-- TODO: classe pendent a base.css --> */
.searchbar .search-input{
  flex:1;
  min-width:0;
  border:0;
  background:transparent;
  padding:0;
  margin:0;
  font:inherit;
  font-size:16px;
  font-weight:500;
  color:var(--color-text);
  outline:none;
}
/* <!-- TODO: classe pendent a base.css --> */
.searchbar .search-input::placeholder{color:var(--color-muted);font-weight:400}
/* <!-- TODO: classe pendent a base.css --> */
.searchbar .search-input::-webkit-search-cancel-button{display:none}
/* --- Estat buit (EmptyState) --- */
.empty-state{
  padding:48px 24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:10px;
  color:var(--color-muted);
}
/* <!-- TODO: classe pendent a base.css --> */
.empty-state .empty-icon{color:var(--color-muted)}
/* <!-- TODO: classe pendent a base.css --> */
.empty-text{
  font-size:15px;
  font-weight:500;
  margin:0;
  color:var(--color-muted);
}
</style>
</head>
<body>
<!--
  US-13 · «Cercar un usuari» — maqueta estàtica (cerca buida, amb text escrit).

  Estats NO representats aquí:
  - Llista inicial (sense q): mateixes files que US-13-cerca-usuaris.html
  - Resultats amb coincidències → US-13-cerca-usuaris.html
  - Carregant… i error + «Reintentar»

  Nota: amb q buit el client no mostra mai «No hi ha resultats»
  (només hi ha estat buit quan hi ha text escrit).
-->
<div class="screen">
  <header class="appbar">
    <a class="appbar-back" href="#"><span aria-hidden="true">←</span> Inici</a>
    <h1 class="appbar-title" style="margin:0">Enviar diners</h1>
  </header>
  <main class="content">
    <section>
      <div class="searchbar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6c7a96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
        </svg>
        <input class="search-input" type="search" value="Zzz" placeholder="@usuari, telèfon o email" aria-label="Cerca un destinatari per @usuari, telèfon o email" autocomplete="off" enterkeyhint="search">
      </div>
    </section>
    <section>
      <div class="card empty-state">
        <svg class="empty-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="7" width="20" height="13" rx="2"></rect>
          <path d="M2 12h6a4 4 0 0 0 8 0h6"></path>
        </svg>
        <p class="empty-text">No hi ha resultats</p>
      </div>
    </section>
  </main>
</div>
</body>
</html>
