<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=390">
  <title>Afegir divisa</title>
  <style>
    :root {
      --color-primary: #4f46e5;
      --color-bg: #f7f9fc;
      --color-surface: #ffffff;
      --color-text: #1a2233;
      --color-muted: #6c7a96;
      --color-border: #e6ebf4;
      --color-income: #16a34a;
      --color-expense: #dc2626;
      --color-icon-bg: #eef0fb;
      --radius: 0.75rem;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--color-bg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--color-text);
      -webkit-font-smoothing: antialiased;
    }
    .screen {
      width: 390px;
      height: 844px;
      overflow: hidden;
      margin: 0 auto;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
    }
    .appbar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 20px 10px;
    }
    .appbar-title {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      color: var(--color-text);
    }
    .appbar-back {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      color: var(--color-muted);
      white-space: nowrap;
    }
    .appbar .appbar-glyph {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-52%);
      font-size: 20px;
      letter-spacing: 1px;
    }
    .content {
      flex: 1;
      overflow: hidden;
      padding: 8px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 1px 2px rgba(26, 34, 51, 0.04);
    }
    .card-title {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text);
    }
    .section-header { margin-bottom: 10px; }
    .section-header .card-title { margin-bottom: 0; }
    .balance-big {
      margin: 0;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.5px;
      font-variant-numeric: tabular-nums;
    }
    .saved-line {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--color-muted);
      font-variant-numeric: tabular-nums;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .actions > * {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      padding: 10px 4px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary {
      background: var(--color-primary);
      color: var(--color-surface);
    }
    .btn-outline {
      background: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
    }
    ul.rows {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 6px 0;
      border-bottom: 1px solid var(--color-border);
    }
    ul.rows li.row:last-child { border-bottom: none; }
    .row-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--color-icon-bg);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .row-name {
      flex: 1;
      min-width: 0;
      font-size: 15px;
      font-weight: 500;
      color: var(--color-text);
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      word-break: break-word;
    }
    .row-sub {
      display: block;
      font-size: 12px;
      font-weight: 400;
      color: var(--color-muted);
      margin-top: 2px;
    }
    .amount {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      white-space: nowrap;
      text-align: right;
    }
    .amount.income { color: var(--color-income); }
    .amount.expense { color: var(--color-expense); }
    .muted { color: var(--color-muted); }
    .badge-owned {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--color-icon-bg);
      color: var(--color-muted);
    }
    .row-disabled .row-name,
    .row-disabled .amount { color: var(--color-muted); }
    .row-disabled .row-icon {
      background: var(--color-border);
      color: var(--color-muted);
    }
    .total-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--color-border);
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text);
    }
    .movement-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 6px 0;
      border-bottom: 1px solid var(--color-border);
    }
    .movement-row:last-child { border-bottom: none; }
    .movement-date {
      font-size: 12px;
      color: var(--color-muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .tick-screen {
      margin: 140px auto 0;
      width: 280px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 36px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 1px 2px rgba(26, 34, 51, 0.04);
    }
    .tick-icon { color: var(--color-income); }
    .tick-text {
      margin: 14px 0 0;
      font-size: 17px;
      font-weight: 600;
      color: var(--color-text);
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="appbar">
      <span class="appbar-back">← Divises</span>
      <h1 class="appbar-title">Afegir divisa</h1>
    </header>
    <main class="content">

      <section class="card">
        <ul class="rows">
          <li class="row row-disabled">
            <span class="row-icon">€</span>
            <span class="row-name">EUR · Euro</span>
            <span class="badge-owned">ja la tens</span>
          </li>
          <li class="row row-disabled">
            <span class="row-icon">$</span>
            <span class="row-name">USD · Dòlar nord-americà</span>
            <span class="badge-owned">ja la tens</span>
          </li>
          <li class="row">
            <span class="row-icon">£</span>
            <span class="row-name">GBP · Lliura esterlina</span>
            <span class="muted" style="font-size:20px">›</span>
          </li>
          <li class="row">
            <span class="row-icon" style="font-size:12px">CHF</span>
            <span class="row-name">CHF · Franc suís</span>
            <span class="muted" style="font-size:20px">›</span>
          </li>
          <li class="row">
            <span class="row-icon">¥</span>
            <span class="row-name">JPY · Ien japonès</span>
            <span class="muted" style="font-size:20px">›</span>
          </li>
        </ul>
      </section>

    </main>
  </div>
</body>
</html>
