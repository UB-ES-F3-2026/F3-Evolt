<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerca per telèfon · F3-Evolt</title>
<style>
    :root {
      --color-primary: #4f46e5;
      --color-bg: #f7f9fc;
      --color-surface: #ffffff;
      --color-text: #1a2233;
      --color-muted: #6c7a96;
      --color-border: #e6ebf4;
      --color-income: #16a34a;
      --color-error: #dc2626;
      --color-icon-bg: #eef0fb;
      --radius: 0.75rem;
      /* Color d'anotació (no és cap token de l'app). */
      --annot: #b45309;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--color-bg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--color-text);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      overflow: hidden;
      margin: 0 auto;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
    }
    /* AppShell.vue:13-28 — «← Inici» amb contorn, títol i menú. */
    .appbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }
    .appbar-back {
      display: inline-block;
      padding: 6px 12px;
      border: 1px solid var(--color-primary);
      border-radius: var(--radius);
      color: var(--color-primary);
      font-size: 14px;
      white-space: nowrap;
    }
    .appbar-title { margin: 0; font-size: 20px; font-weight: 700; white-space: nowrap; }
    .appbar .menu {
      margin-left: auto;
      display: grid;
      place-items: center;
      padding: 6px;
      border-radius: 50%;
      color: var(--color-muted);
    }
    .content {
      flex: 1;
      overflow: hidden;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--color-surface);
      border-radius: var(--radius);
      padding: 16px 20px;
    }
    .label {
      display: block;
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-muted);
    }
    /* MovementsView.vue — barra de cerca amb lupa; aquí és l'<input> real de la maqueta. */
    .searchbar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 50px;
      padding: 12px 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-primary);
      border-radius: var(--radius);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }
    .search-input {
      flex: 1;
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 16px;
      font-weight: 500;
      color: var(--color-text);
      outline: none;
    }
    .search-input::placeholder { color: var(--color-muted); font-weight: 400; }
    .search-input::-webkit-search-cancel-button { display: none; }
    .caret {
      display: inline-block;
      width: 2px;
      height: 18px;
      margin-left: -8px;
      background: var(--color-primary);
      vertical-align: -3px;
    }
    ul.rows { list-style: none; margin: 0; padding: 0; }
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 8px 0;
      border-bottom: 1px solid var(--color-border);
    }
    ul.rows li.row:last-child { border-bottom: none; }
    .row-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--color-icon-bg);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      flex: none;
    }
    .row-name { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; }
    .row-sub { display: block; margin-top: 2px; font-size: 12px; font-weight: 400; color: var(--color-muted); }
    /* --- Estat seleccionat (no existeix encara al codi) --- */
    .row.selected {
      margin: 0 -8px;
      padding: 8px;
      border-bottom-color: transparent;
      background: var(--color-icon-bg);
      border-radius: 10px;
      box-shadow: inset 3px 0 0 0 var(--color-primary);
    }
    .row.selected .row-name { font-weight: 600; }
    .row.selected .row-icon { background: var(--color-primary); color: var(--color-surface); }
    .row-check { flex: none; display: grid; place-items: center; color: var(--color-primary); }
    .row.pressed { background: var(--color-icon-bg); margin: 0 -8px; padding: 8px; border-radius: 10px; border-bottom-color: transparent; }
    /* --- Xip del destinatari triat dins la barra --- */
    .chip {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 3px 6px 3px 3px;
      background: var(--color-icon-bg);
      border-radius: 999px;
    }
    .chip-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--color-primary);
      color: var(--color-surface);
      font-size: 11px;
      font-weight: 700;
      display: grid;
      place-items: center;
      flex: none;
    }
    .chip-name { font-size: 14px; font-weight: 600; }
    .chip-handle { font-size: 12px; color: var(--color-muted); }
    .chip-x { display: grid; place-items: center; color: var(--color-muted); margin-left: 2px; }
    /* --- Estat buit (EmptyState.vue) --- */
    .empty-state {
      padding: 48px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--color-muted);
      text-align: center;
    }
    .empty-text { margin: 0; font-size: 15px; font-weight: 500; color: var(--color-muted); }
    /* --- Import (US-14 «Enviar») --- */
    .amount-display {
      margin: 4px 0 0;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.5px;
      font-variant-numeric: tabular-nums;
    }
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      border-radius: var(--radius);
      background: var(--color-primary);
      color: var(--color-surface);
      font-size: 15px;
      font-weight: 600;
    }
    .btn-primary:disabled,
    .btn-primary.is-disabled {
      background: var(--color-border);
      color: var(--color-muted);
    }
    /* --- Anotació (no forma part de l'app) --- */
    .annot {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 20px;
      display: flex;
      gap: 10px;
      padding: 10px 12px;
      background: var(--color-surface);
      border: 1px solid var(--annot);
      border-left: 4px solid var(--annot);
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(26, 34, 51, 0.12);
      font-size: 13px;
      line-height: 1.35;
    }
    .annot-num {
      flex: none;
      width: 20px;
      height: 20px;
      margin-top: 1px;
      border-radius: 50%;
      background: var(--annot);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      display: grid;
      place-items: center;
    }
    .annot-text { margin: 0; }
    .annot-note { display: block; margin-top: 3px; font-size: 12px; color: var(--color-muted); }
</style>
</head>
<body>
<!--
  US-13 · «Cercar un usuari» — cerca per telèfon amb coincidència.

  Mateixa pantalla que US-13-cerca-usuaris.png (/pagaments, «Enviar diners»), però amb un
  telèfon escrit: «611 22 33 02» dona la fila de Huabin (US-13 §7.1). La fila només té
  inicials, nom i @usuari en gris: cap import ni cap saldo (T13.2, criteri 2 del PO).
  La variant «+34 611 22 33 02» dona exactament la mateixa fila (es comparen els 9 últims dígits).

  Estats no representats: carregant (250 ms), error + «Reintentar», sessió expirada.
-->
<div class="screen">
  <header class="appbar">
    <span class="appbar-back">← Inici</span>
    <h1 class="appbar-title">Enviar diners</h1>
    <span class="menu" aria-label="Menú" title="Menú"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></span>
  </header>
  <main class="content">
    <div class="searchbar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6c7a96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg><input class="search-input" type="search" value="611 22 33 02" placeholder="@usuari, telèfon o email" aria-label="Cerca un destinatari per @usuari, telèfon o email" autocomplete="off" enterkeyhint="search"><span class="caret"></span></div>
    <section>
      <span class="label">Resultats de la cerca</span>
      <div class="card" style="padding-top:4px;padding-bottom:4px">
        <ul class="rows">
          <li class="row">
            <span class="row-icon">HU</span>
            <span class="row-name">Huabin<span class="row-sub">@123huabin123</span></span>
          </li>
        </ul>
      </div>
    </section>
  </main>
<div class="annot" role="note">
    <span class="annot-num">1</span>
    <p class="annot-text">Telèfon de 9 dígits → Huabin; «+34 611 22 33 02» dona la mateixa fila<span class="annot-note">US-13 §7.1: s'eliminen espais i el prefix +34 i es comparen els 9 últims dígits. La fila no mostra cap import ni cap saldo (T13.2).</span></p>
  </div>
</div>
</body>
</html>
