<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buidar el subcompte en divisa amb un canvi</title>
  <style>
    :root {
      --color-bg: #f7f9fc;
      --color-surface: #ffffff;
      --color-text: #1a2233;
      --color-muted: #6c7a96;
      --color-border: #e6ebf4;
      --color-primary: #4f46e5;
      --color-income: #16a34a;
      --color-expense: #dc2626;
      --radius: 0.75rem;
      --annot: #b45309;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 390px;
      height: 844px;
      overflow: hidden;
    }
    body {
      background: var(--color-bg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--color-text);
      -webkit-font-smoothing: antialiased;
    }
    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
    }
    .appbar {
      height: 56px;
      flex: 0 0 56px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--color-bg);
    }
    .appbar h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      color: var(--color-text);
    }
    .back {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      padding: 8px;
      font-size: 24px;
      line-height: 1;
      color: var(--color-text);
      cursor: pointer;
    }
    .content {
      flex: 1;
      overflow: hidden;
      padding: 4px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 12px;
    }
    .label {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--color-text);
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 2px solid var(--color-primary);
      border-radius: var(--radius);
      padding: 12px;
    }
    .row-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text);
    }
    .row-amount {
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--color-text);
    }
    .amount-display {
      font-size: 30px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--color-text);
      padding-bottom: 6px;
      border-bottom: 1.5px solid var(--color-border);
    }
    .estimate {
      margin: 0;
      font-size: 20px;
      line-height: 1.3;
      color: var(--color-muted);
      font-variant-numeric: tabular-nums;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .key {
      height: 48px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface);
      font-family: inherit;
      font-size: 19px;
      font-weight: 500;
      color: var(--color-text);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: var(--radius);
      background: var(--color-primary);
      color: #ffffff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
    }
    /* Anotació: no forma part de l'app, només explica el resultat del canvi. */
    .annot {
      display: flex;
      gap: 10px;
      padding: 10px 12px;
      background: var(--color-surface);
      border: 1px solid var(--annot);
      border-left: 4px solid var(--annot);
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.35;
    }
    .annot-num {
      flex: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--annot);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      display: grid;
      place-items: center;
      margin-top: 1px;
    }
    .annot-text { margin: 0; }
    .annot-text strong { font-weight: 700; }
  </style>
</head>
<body>
  <!--
    US-26 · Buidar un subcompte en divisa per poder-lo eliminar (390×844, PNG 780×1688).

    «Aportar» només hi afegeix diners; per treure'ls, l'única via és «Canviar» (US-27).
    Per eliminar el USD, primer se'n buida el saldo canviant-lo a euros: 312,86 $ +
    4,69 $ de comissió = 317,55 $, que és tot el saldo. El subcompte queda a 0,00 $ i
    la finestra 2 de l'eliminació ja s'obre.
  -->
  <div class="screen">
    <header class="appbar">
      <button type="button" class="back" aria-label="Enrere">←</button>
      <h1>Canviar</h1>
    </header>
    <main class="content">
      <section class="card">
        <p class="label">Subcompte d'origen</p>
        <div class="row">
          <span class="row-name">USD · Dòlar nord-americà</span>
          <span class="row-amount">317,55 $</span>
        </div>
      </section>
      <section class="card">
        <p class="label">Subcompte de destí</p>
        <div class="row">
          <span class="row-name">EUR · Euro</span>
          <span class="row-amount">1.250,50 €</span>
        </div>
      </section>
      <section class="card">
        <p class="label">Import</p>
        <div class="amount-display">312,86</div>
      </section>
      <p class="estimate">Rebràs aproximadament 284,70 €</p>
      <div class="keypad" aria-hidden="true">
        <div class="key">1</div>
        <div class="key">2</div>
        <div class="key">3</div>
        <div class="key">4</div>
        <div class="key">5</div>
        <div class="key">6</div>
        <div class="key">7</div>
        <div class="key">8</div>
        <div class="key">9</div>
        <div class="key">,</div>
        <div class="key">0</div>
        <div class="key">⌫</div>
      </div>
      <button type="button" class="btn-primary">Continuar</button>
      <div class="annot" role="note">
        <span class="annot-num">1</span>
        <p class="annot-text"><strong>En confirmar, el subcompte USD queda a 0,00 $</strong> i ja es pot eliminar amb «Eliminar subcompte».</p>
      </div>
    </main>
  </div>
</body>
</html>
