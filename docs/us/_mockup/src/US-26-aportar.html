<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aportar a Dòlar nord-americà</title>
  <style>
    :root {
      --color-bg: #f7f9fc;
      --color-surface: #ffffff;
      --color-text: #1a2233;
      --color-muted: #6c7a96;
      --color-border: #e6ebf4;
      --color-primary: #4f46e5;
      --color-income: #16a34a;
      --color-expense: #dc2626;
      --radius: 0.75rem;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 390px;
      height: 844px;
      overflow: hidden;
    }
    body {
      background: var(--color-bg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--color-text);
      -webkit-font-smoothing: antialiased;
    }
    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
    }
    /* AppShell.vue: capçalera blanca amb vora inferior, enllaç d'enrere a l'esquerra. */
    .appbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
    }
    .appbar h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      color: var(--color-text);
    }
    .back {
      flex: none;
      padding: 6px 10px;
      border: 1px solid var(--color-primary);
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      color: var(--color-primary);
      white-space: nowrap;
    }
    .content {
      flex: 1;
      overflow: hidden;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .card {
      display: flex;
      flex-direction: column;
      background: var(--color-surface);
      border-radius: var(--radius);
      padding: 20px;
    }
    .balances {
      margin: 0 0 20px;
    }
    .balance-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 6px 0;
    }
    .balance-row dt {
      margin: 0;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--color-muted);
      font-size: 15px;
    }
    .balance-row dd {
      margin: 0;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .label {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
      color: var(--color-muted);
    }
    .field {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-surface);
    }
    .input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: none;
      border-radius: var(--radius);
      background: transparent;
      color: var(--color-text);
      font-family: inherit;
      font-size: 24px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .input::placeholder { color: var(--color-muted); opacity: 0.6; }
    .input:focus { outline: none; }
    .currency {
      padding-right: 12px;
      font-size: 24px;
      font-weight: 600;
      color: var(--color-muted);
    }
    .button {
      width: 100%;
      height: 48px;
      padding: 12px;
      border: none;
      border-radius: var(--radius);
      background: var(--color-primary);
      color: #ffffff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      opacity: 0.5;
      cursor: not-allowed;
    }
    .cancel {
      margin-top: 12px;
      font-size: 14px;
      text-align: center;
      color: var(--color-primary);
    }
    .note {
      margin: 0;
      font-size: 13px;
      color: var(--color-muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <!--
    US-26 · «Aportar a <divisa>» (390×844, PNG 780×1688), decisió del PO.

    El detall del subcompte té un botó «Aportar» que obre aquesta pantalla, bessona de
    «Aportar a <guardiola>» (ContributeView.vue): les dues files de saldo, el camp
    «Import» amb el símbol de la divisa i «Confirmar» desactivat mentre l'import no és
    vàlid. L'aportació es fa en la divisa del subcompte (aquí, dòlars).
  -->
  <div class="screen">
    <header class="appbar">
      <span class="back">← USD</span>
      <h1>Aportar a Dòlar nord-americà</h1>
    </header>
    <main class="content">
      <form class="card">
        <dl class="balances">
          <div class="balance-row">
            <dt>Saldo disponible</dt>
            <dd>1.250,50 €</dd>
          </div>
          <div class="balance-row">
            <dt>USD · Dòlar nord-americà</dt>
            <dd>317,55 $</dd>
          </div>
        </dl>

        <label class="label" for="amount">Import</label>
        <div class="field">
          <input id="amount" class="input" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" disabled>
          <span class="currency" aria-hidden="true">$</span>
        </div>

        <button type="submit" class="button" disabled>Confirmar</button>
        <span class="cancel">Cancel·lar</span>
      </form>
      <p class="note" style="margin-top:16px;">L'import s'escriu en dòlars nord-americans.</p>
    </main>
  </div>
</body>
</html>
