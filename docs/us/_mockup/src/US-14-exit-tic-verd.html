<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enviament realitzat · F3-Evolt</title>
<style>
:root{
  --color-bg:#f7f9fc;
  --color-surface:#ffffff;
  --color-text:#1a2233;
  --color-muted:#6c7a96;
  --color-border:#e6ebf4;
  --color-primary:#4f46e5;
  --color-income:#16a34a;
  --color-error:#dc2626;
  --radius:0.75rem;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--color-bg);
  color:var(--color-text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
}
/* --- Pantalla 390x844 --- */
.screen{
  width:390px;
  height:844px;
  background:var(--color-bg);
  overflow:hidden;
  margin:0 auto;
  position:relative;
  display:flex;
  flex-direction:column;
}
/* --- Barra superior --- */
.appbar{
  background:var(--color-surface);
  border-bottom:1px solid var(--color-border);
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:8px;
}
.appbar-title{
  font-size:17px;
  font-weight:600;
}
.appbar-back{
  color:var(--color-muted);
  font-size:20px;
  line-height:1;
}
/* --- Contingut --- */
.content{
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
/* --- Pantalla de confirmació (patró .tick-screen) --- */
.tick-screen{
  min-height:420px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:12px;
  background:var(--color-surface);
  border-radius:var(--radius);
  border:1px solid var(--color-border);
}
.tick-icon{color:var(--color-income)}
/* <!-- TODO: classe pendent a base.css --> */
.tick-circle{
  width:72px;
  height:72px;
  border-radius:50%;
  background:var(--color-income);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto;
}
.tick-text{
  font-size:17px;
  font-weight:600;
  margin:0;
}
.saved-line{
  font-size:14px;
  color:var(--color-muted);
  margin:0;
}
</style>
</head>
<body>
<!--
  US-14 · «Enviar diners a usuaris» — maqueta estàtica (èxit amb tic verd).

  És un estat INLINE dins de «Confirmar» (mateix patró que TopUpView/ContributeView):
  role="status", dura CONFIRMATION_MS = 1500 ms i torna sola a Inici.
  Per això no hi ha cap botó i la capçalera es manté.

  Estats NO representats aquí: els errors de «Confirmar enviament»
  (vegeu US-14-confirmar-enviament.html i el doc US-14.md).
-->
<div class="screen">
  <header class="appbar">
    <span class="appbar-back" aria-hidden="true">←</span>
    <h1 class="appbar-title" style="margin:0">Confirmar</h1>
  </header>
  <main class="content" style="flex:1">
    <div class="tick-screen" style="flex:1" role="status">
      <div class="tick-icon tick-circle">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6L9 17l-5-5"></path>
        </svg>
      </div>
      <p class="tick-text">Has enviat 20,00&nbsp;€ a Usuari nou</p>
      <p class="saved-line">Saldo disponible: 3.775,21&nbsp;€</p>
    </div>
  </main>
</div>
</body>
</html>
