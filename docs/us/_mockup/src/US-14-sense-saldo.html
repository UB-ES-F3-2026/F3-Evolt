<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>US-14 · no tens prou saldo</title>
<style>
:root{--color-bg:#f7f9fc;--color-surface:#fff;--color-text:#1a2233;--color-muted:#6c7a96;--color-border:#e6ebf4;--color-primary:#4f46e5;--color-income:#16a34a;--color-error:#dc2626;--color-icon-bg:#eef0fb;--radius:.75rem;--annot:#b45309}
*{box-sizing:border-box}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.screen{position:relative;width:390px;height:844px;overflow:hidden;margin:0 auto;background:var(--color-bg);display:flex;flex-direction:column}
.appbar{display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--color-surface);border-bottom:1px solid var(--color-border)}
.appbar-back{display:inline-block;padding:6px 12px;border:1px solid var(--color-primary);border-radius:var(--radius);color:var(--color-primary);font-size:14px;white-space:nowrap}
.appbar-title{margin:0;font-size:20px;font-weight:700;white-space:nowrap}
.appbar .menu{margin-left:auto;display:grid;place-items:center;padding:6px;border-radius:50%;color:var(--color-muted)}
.content{flex:1;overflow:hidden;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--color-surface);border-radius:var(--radius);padding:16px 20px}
.label{display:block;margin:0 0 6px;font-size:13px;font-weight:600;color:var(--color-muted)}
.row{display:flex;align-items:center;gap:12px;min-height:56px}
.row-icon{width:36px;height:36px;border-radius:50%;background:var(--color-icon-bg);color:var(--color-primary);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex:none}
.row-name{flex:1;min-width:0;font-size:15px;font-weight:500}
.row-sub{display:block;margin-top:2px;font-size:12px;font-weight:400;color:var(--color-muted)}
.amount-display{margin:0;font-size:34px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.error-line{margin:8px 0 0;font-size:14px;font-weight:600;color:var(--color-error)}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.key{display:grid;place-items:center;min-height:56px;border:1px solid var(--color-border);border-radius:var(--radius);background:var(--color-surface);font-size:22px;font-weight:600}
.key-action{color:var(--color-muted);font-size:18px}
.btn-primary{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:var(--radius);background:var(--color-primary);color:var(--color-surface);font-size:15px;font-weight:600}
.btn-primary.is-disabled{background:var(--color-border);color:var(--color-muted)}
.annot{position:absolute;left:20px;right:20px;bottom:20px;display:flex;gap:10px;padding:10px 12px;background:var(--color-surface);border:1px solid var(--annot);border-left:4px solid var(--annot);border-radius:12px;box-shadow:0 6px 16px rgba(26,34,51,.12);font-size:13px;line-height:1.35}
.annot-num{flex:none;width:20px;height:20px;margin-top:1px;border-radius:50%;background:var(--annot);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.annot-text{margin:0}
.annot-note{display:block;margin-top:3px;font-size:12px;color:var(--color-muted)}
</style>
</head>
<body>
<!--
  US-14 · «Enviar» — «No tens prou saldo» detectat ABANS d'enviar.

  Saldo de la sessió: 3.795,21 € (GET /api/home). S'escriuen 4.000,00 € amb el teclat:
  com que l'import supera el saldo, surt en vermell «No tens prou saldo.» amb role="alert"
  sota el display i el botó «Continuar» queda desactivat. No es fa cap petició.

  El servidor continua manant: si el saldo canvia entre la lectura i l'enviament, el
  POST /api/transfers respon 422 INSUFFICIENT_BALANCE i el mateix text surt sota
  «Confirmar enviament».
-->
<div class="screen">
  <header class="appbar">
    <span class="appbar-back">← Inici</span>
    <h1 class="appbar-title">Enviar</h1>
    <span class="menu" aria-label="Menú" title="Menú"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></span>
  </header>
  <main class="content" style="padding-bottom:118px">
    <div class="card" style="padding-top:8px;padding-bottom:8px">
      <div class="row">
        <span class="row-icon">UN</span>
        <span class="row-name">Usuari nou<span class="row-sub">@buit</span></span>
      </div>
    </div>
    <div class="card">
      <span class="label">Import</span>
      <p class="amount-display">4.000,00 €</p>
      <p class="error-line" role="alert">No tens prou saldo.</p>
    </div>
    <div class="keypad">
      <span class="key">1</span><span class="key">2</span><span class="key">3</span>
      <span class="key">4</span><span class="key">5</span><span class="key">6</span>
      <span class="key">7</span><span class="key">8</span><span class="key">9</span>
      <span class="key key-action">,</span><span class="key">0</span><span class="key key-action">⌫</span>
    </div>
    <span class="btn-primary is-disabled">Continuar</span>
  </main>
  <div class="annot" role="note">
    <span class="annot-num">1</span>
    <p class="annot-text">4.000,00 € &gt; 3.795,21 €: missatge vermell i «Continuar» desactivat<span class="annot-note">Cap petició: el client només respon abans d'enviar. El servidor mana si el saldo ha canviat (422 INSUFFICIENT_BALANCE).</span></p>
  </div>
</div>
</body>
</html>
