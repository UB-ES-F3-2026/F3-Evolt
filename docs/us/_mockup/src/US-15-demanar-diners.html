<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demanar diners · F3-Evolt</title>
<style>
:root{
  --color-bg:#f7f9fc;
  --color-surface:#ffffff;
  --color-text:#1a2233;
  --color-muted:#6c7a96;
  --color-border:#e6ebf4;
  --color-primary:#4f46e5;
  --color-primary-hover:#4338ca;
  --color-error:#dc2626;
  --radius:0.75rem;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--color-bg);
  color:var(--color-text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
}
.phone{
  width:390px;
  min-height:844px;
  margin:0 auto;
  position:relative;
  overflow:hidden;
  background:var(--color-bg);
}
/* Header */
.header{
  background:var(--color-surface);
  border-bottom:1px solid var(--color-border);
  padding:16px;
}
.back{
  display:inline-flex;
  align-items:center;
  gap:4px;
  color:var(--color-primary);
  font-size:15px;
  font-weight:500;
  text-decoration:none;
}
.header h1{
  margin:6px 0 0;
  font-size:20px;
  font-weight:600;
  line-height:1.3;
}
/* Content */
.content{
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.label{
  display:block;
  font-size:14px;
  color:var(--color-muted);
  margin-bottom:6px;
}
/* Search bar */
.searchbar{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:var(--radius);
  padding:12px 16px;
  color:var(--color-muted);
  font-size:16px;
}
.searchbar .placeholder{color:var(--color-muted)}
/* Results card */
.results{
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:var(--radius);
  padding:4px 0;
  margin-top:8px;
}
.result-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 16px;
  position:relative;
}
.result-row.selected{
  background:#eef2ff;
}
.result-row.selected::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;
  background:var(--color-primary);
  border-radius:0 2px 2px 0;
}
.result-row + .result-row{
  border-top:1px solid var(--color-border);
}
.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#e6ebf4;
  color:var(--color-muted);
  font-size:14px;
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
}
.result-name{
  font-size:15px;
  font-weight:500;
  line-height:1.3;
}
.result-handle{
  font-size:13px;
  color:var(--color-muted);
  line-height:1.3;
}
.check{
  margin-left:auto;
  color:var(--color-primary);
  font-size:16px;
  font-weight:600;
}
/* Fields */
.field{
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:var(--radius);
  padding:12px 16px;
  display:flex;
  align-items:center;
  font-size:16px;
}
.field .suffix{
  margin-left:auto;
  color:var(--color-muted);
}
.help{
  margin-top:6px;
  font-size:12px;
  color:var(--color-muted);
}
/* Button */
.btn{
  display:block;
  width:100%;
  min-height:48px;
  border:none;
  border-radius:var(--radius);
  font-family:inherit;
  font-size:16px;
  font-weight:600;
  background:var(--color-primary);
  color:#fff;
  margin-top:4px;
}
/* Ghost exit button */
.btn-ghost{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  min-height:48px;
  margin-top:12px;
  background:var(--color-surface);
  color:var(--color-text);
  font-family:inherit;
  font-size:16px;
  font-weight:600;
  border:1px solid var(--color-border);
  border-radius:var(--radius);
}
</style>
</head>
<body>
<!--
  Estàtic (mockup visual) — estats NO representats aquí:
  - «Carregant…» (loading)
  - Buit: «No hi ha resultats»
  - Error + botó «Reintentar»
  - Enviament deshabilitat mentre els camps són invàlids
  - Etiqueta del botó «Enviant…» mentre s'envia
  - Targeta d'èxit: «Sol·licitud enviada a Alicia.» (role="status")
-->
<div class="phone">
  <header class="header">
    <a class="back" href="#"><span aria-hidden="true">←</span> Inici</a>
    <h1>Demanar diners</h1>
  </header>
  <main class="content">
    <section>
      <span class="label">Destinatari</span>
      <div class="searchbar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6c7a96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
        </svg>
        <span class="placeholder">@usuari, telèfon o email</span>
      </div>
      <div class="results">
        <div class="result-row selected">
          <div class="avatar">A</div>
          <div>
            <div class="result-name">Alicia</div>
            <div class="result-handle">@alicia</div>
          </div>
          <span class="check" aria-hidden="true">✓</span>
        </div>
        <div class="result-row">
          <div class="avatar">H</div>
          <div>
            <div class="result-name">Huabin</div>
            <div class="result-handle">@huabin</div>
          </div>
        </div>
      </div>
    </section>
    <section>
      <span class="label">Import</span>
      <div class="field">
        <span>25,00</span>
        <span class="suffix">€</span>
      </div>
      <div class="help">Escriu un import en euros, amb 2 decimals com a màxim.</div>
    </section>
    <section>
      <span class="label">Concepte</span>
      <div class="field">
        <span>El sopar de divendres</span>
      </div>
    </section>
    <button class="btn" type="button">Enviar sol·licitud</button>
    <button class="btn-ghost" type="button">Cancel·lar</button>
  </main>
</div>
</body>
</html>
