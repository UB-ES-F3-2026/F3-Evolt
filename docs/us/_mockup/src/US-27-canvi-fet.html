<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canvi fet</title>
  <style>
    :root {
      --color-bg: #f7f9fc;
      --color-surface: #ffffff;
      --color-text: #1a2233;
      --color-muted: #6c7a96;
      --color-border: #e6ebf4;
      --color-primary: #4f46e5;
      --color-income: #16a34a;
      --color-expense: #dc2626;
      --radius: 0.75rem;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 390px;
      height: 844px;
      overflow: hidden;
    }
    body {
      background: var(--color-bg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--color-text);
      -webkit-font-smoothing: antialiased;
    }
    .screen {
      width: 390px;
      height: 844px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: calc(390px - 32px);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 1rem;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .balances {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .balance-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
      color: var(--color-text);
    }
    .balance-value {
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="card">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <circle cx="20" cy="20" r="20" fill="#16a34a"/>
        <path d="M12 20.5L17.5 26L28 14.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p style="margin:0; font-size:22px; font-weight:600; color:#1a2233;" role="status">Canvi fet</p>
      <p style="margin:0; font-size:14px; color:var(--color-muted);">Tornant a Inici…</p>
      <div class="balances">
        <div class="balance-row">
          <span>Compte en euros</span>
          <span class="balance-value">1.149,00 €</span>
        </div>
        <div class="balance-row">
          <span>USD · Dòlar nord-americà</span>
          <span class="balance-value">427,16 $</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
