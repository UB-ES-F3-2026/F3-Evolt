<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sol·licituds enviades · estat buit · F3-Evolt</title>
<style>
:root{
  --color-bg:#f7f9fc;
  --color-surface:#ffffff;
  --color-text:#1a2233;
  --color-muted:#6c7a96;
  --color-border:#e6ebf4;
  --color-primary:#4f46e5;
  --color-income:#16a34a;
  --color-error:#dc2626;
  --radius:0.75rem;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--color-bg);
  color:var(--color-text);
  font-size:16px;
  line-height:1.5;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
/* --- Pantalla 390x844 --- */
.screen{
  width:390px;
  height:844px;
  margin:0 auto;
  position:relative;
  overflow:hidden;
  background:var(--color-bg);
  display:flex;
  flex-direction:column;
}
/* --- Header (AppShell amb `back` i el títol de la vista) --- */
.header{
  background:var(--color-surface);
  border-bottom:1px solid var(--color-border);
  padding:16px;
  flex:none;
}
.back{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:var(--color-primary);
  font-size:15px;
  font-weight:500;
  text-decoration:none;
}
.title{
  margin:4px 0 0 0;
  font-size:20px;
  font-weight:600;
  line-height:1.3;
}
/* --- Contingut --- */
.content{
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
  flex:1;
}
.card{
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:var(--radius);
  padding:16px;
}
/* --- Estat buit (EmptyState dins de section.card.empty) --- */
.empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  padding:32px 16px;
  text-align:center;
  color:var(--color-muted);
  font-size:15px;
}
.create{
  margin-top:4px;
  font-size:15px;
  font-weight:600;
  color:var(--color-primary);
  text-decoration:none;
}
</style>
</head>
<body>
<!--
  US-15 · «Sol·licituds enviades» amb la llista BUIDA (MoneyRequestsView) — maqueta estàtica.

  Cas representat: GET /api/money-requests?scope=sent retorna { "items": [] }.
  Es veu l'EmptyState «Encara no has enviat cap sol·licitud.» (C22) amb l'enllaç
  estil .create «Demanar diners» (C15), que és el camí cap a /requests/new.
  Camí de tornada d'aquesta pantalla: «← Inici» de l'AppShell (C28).

  NO representats aquí:
  - Carregant: «Carregant…» (LoadingIndicator) — l'estat buit mai no surt abans
    de la primera resposta (isLoading arrenca a true).
  - Error de càrrega: «No s'han pogut carregar les sol·licituds.» + «Reintentar»
  - Llista amb files: US-15-sollicituds-enviades.png
  - Diàleg «Cancel·lar sol·licitud»: US-15-cancelar-confirmacio.png
-->
<div class="screen">
  <header class="header">
    <a class="back" href="#">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Inici
    </a>
    <h1 class="title">Sol·licituds enviades</h1>
  </header>

  <main class="content">
    <section class="card empty">
      <p>Encara no has enviat cap sol·licitud.</p>
      <a class="create" href="#">Demanar diners</a>
    </section>
  </main>
</div>
</body>
</html>
