<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retirada feta · Has retirat 30,00 € de Vacances · F3-Evolt</title>
<style>
:root{
  --color-bg:#f7f9fc;
  --color-surface:#ffffff;
  --color-text:#1a2233;
  --color-muted:#6c7a96;
  --color-border:#e6ebf4;
  --color-primary:#4f46e5;
  --color-income:#16a34a;
  --color-expense:#dc2626;
  --color-error:#dc2626;
  --radius:0.75rem;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--color-bg);
  color:var(--color-text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
}
/* --- Pantalla 390x844 --- */
.screen{
  width:390px;
  height:844px;
  background:var(--color-bg);
  overflow:hidden;
  margin:0 auto;
  position:relative;
  display:flex;
  flex-direction:column;
}
/* --- Barra superior (C3: «Retirar de Vacances») --- */
.appbar{
  background:var(--color-surface);
  border-bottom:1px solid var(--color-border);
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:8px;
  flex:none;
}
.back-link{
  display:inline-block;
  margin-bottom:2px;
  font-size:14px;
  color:var(--color-primary);
  text-decoration:none;
}
.appbar-title{
  font-size:17px;
  font-weight:600;
  margin:0;
}
/* --- Contingut --- */
.content{
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
  flex:1;
}
.card{
  background:var(--color-surface);
  border-radius:var(--radius);
  padding:20px;
}
/* --- Targeta d'èxit (patró de section.card.success de ContributeView.vue) --- */
.success{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px; /* 0.75rem */
  padding:32px 20px; /* 2rem 1.25rem */
  text-align:center;
}
.success-icon{
  color:var(--color-income); /* tic verd #16a34a */
}
.success-text{
  margin:0;
  font-size:18px; /* 1.125rem */
  font-weight:600;
  font-variant-numeric:tabular-nums;
}
.success-balances{
  margin:0;
  font-size:14px; /* 0.875rem */
  color:var(--color-muted);
  font-variant-numeric:tabular-nums;
}
</style>
</head>
<body>
<!--
  US-19 · Estat d'èxit de «Retirar de Vacances» (WithdrawView) — maqueta estàtica.
  Representa la confirmació després del 201 del POST /api/pots/pot-01/withdrawals
  (retirada de 30,00 € de «Vacances»): la form es substitueix per la targeta
  d'èxit (section.card.success, role="status", tic verd CircleCheck 40 px),
  amb el text C11 «Has retirat 30,00 € de Vacances» i els dos saldos C12.
  Al cap de 1.500 ms, navegació replace al detall de la guardiola.

  Estats NO representats aquí (es documenten al doc, no als mockups):
  - Formulari amb validació en viu (maqueta US-19-retirar-vacances.html)
  - «Enviant…» mentre s'envia
  - Error del servidor / xarxa sota el botó (role="alert")
-->
<div class="screen">
  <header class="appbar">
    <h1 class="appbar-title">Retirar de Vacances</h1>
  </header>
  <main class="content">
    <a class="back-link" href="#"><span aria-hidden="true">←</span> Inici</a>
    <section class="card success" role="status">
      <span class="success-icon" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </span>
      <p class="success-text">Has retirat 30,00&nbsp;€ de Vacances</p>
      <p class="success-balances">Saldo disponible: 3.825,21&nbsp;€ · Vacances: 120,00&nbsp;€</p>
    </section>
  </main>
</div>
</body>
</html>
