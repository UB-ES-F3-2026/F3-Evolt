<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerca usuaris · F3-Evolt</title>
<style>
:root{
  --color-bg:#f7f9fc;
  --color-surface:#ffffff;
  --color-text:#1a2233;
  --color-muted:#6c7a96;
  --color-border:#e6ebf4;
  --color-primary:#4f46e5;
  --color-income:#16a34a;
  --color-error:#dc2626;
  --radius:0.75rem;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--color-bg);
  color:var(--color-text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
}
/* --- Pantalla 390x844 --- */
.screen{
  width:390px;
  height:844px;
  background:var(--color-bg);
  overflow:hidden;
  margin:0 auto;
  position:relative;
}
/* --- Barra superior --- */
.appbar{
  background:var(--color-surface);
  border-bottom:1px solid var(--color-border);
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:8px;
}
.appbar-title{
  font-size:17px;
  font-weight:600;
}
.appbar-back{
  display:inline-flex;
  align-items:center;
  gap:4px;
  color:var(--color-primary);
  font-size:15px;
  font-weight:500;
  text-decoration:none;
}
/* --- Contingut --- */
.content{
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.card{
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:var(--radius);
  padding:16px;
}
/* <!-- TODO: classe pendent a base.css --> */
.label{
  display:block;
  font-size:13px;
  color:var(--color-muted);
  margin-bottom:6px;
}
/* --- Barra de cerca --- */
/* <!-- TODO: classe pendent a base.css --> */
.searchbar{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--color-surface);
  border:1px solid var(--color-primary);
  border-radius:var(--radius);
  padding:12px 16px;
  font-size:16px;
  box-shadow:0 0 0 3px #4f46e51a;
}
/* <!-- TODO: classe pendent a base.css --> */
.searchbar .search-input{
  flex:1;
  min-width:0;
  border:0;
  background:transparent;
  padding:0;
  margin:0;
  font:inherit;
  font-size:16px;
  font-weight:500;
  color:var(--color-text);
  outline:none;
}
/* <!-- TODO: classe pendent a base.css --> */
.searchbar .search-input::placeholder{color:var(--color-muted);font-weight:400}
/* <!-- TODO: classe pendent a base.css --> */
.searchbar .search-input::-webkit-search-cancel-button{display:none}
/* --- Llista de resultats --- */
ul.rows{
  list-style:none;
  margin:0;
  padding:0;
}
.row{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:56px;
  padding:8px 0;
  border-top:1px solid var(--color-border);
}
ul.rows > li.row:first-child{border-top:none}
.row-icon{
  width:36px;
  height:36px;
  background:#eef0fb;
  color:var(--color-primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:600;
  border-radius:50%;
  flex:none;
}
.row-name{
  flex:1;
  font-size:15px;
  font-weight:500;
}
.row-sub{
  font-size:12px;
  color:var(--color-muted);
  display:block;
  margin-top:2px;
}
.muted{color:var(--color-muted)}
</style>
</head>
<body>
<!--
  US-13 · «Cercar un usuari» — maqueta estàtica (cerca amb resultats).

  Estats NO representats aquí:
  - Carregant… (debounce 250 ms)
  - Cerca buida: «No hi ha resultats» → US-13-cerca-buida.html
  - Error de cerca: ErrorState + botó «Reintentar»
  - Sessió expirada → redirecció a login

  La llista inicial (sense q) és el mateix format de files.
  Cap fila mostra saldo ni cap dada financera (T13.2).
-->
<div class="screen">
  <header class="appbar">
    <a class="appbar-back" href="#"><span aria-hidden="true">←</span> Inici</a>
    <h1 class="appbar-title" style="margin:0">Enviar diners</h1>
  </header>
  <main class="content">
    <section>
      <div class="searchbar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6c7a96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
        </svg>
        <input class="search-input" type="search" value="Usuari" placeholder="@usuari, telèfon o email" aria-label="Cerca un destinatari per @usuari, telèfon o email" autocomplete="off" enterkeyhint="search">
      </div>
    </section>
    <section>
      <span class="label">Resultats de la cerca</span>
      <div class="card" style="padding:4px 16px">
        <ul class="rows">
          <li class="row">
            <span class="row-icon">UN</span>
            <div class="row-name">Usuari nou<span class="row-sub">@buit</span></div>
          </li>
          <li class="row">
            <span class="row-icon">AL</span>
            <div class="row-name">Alicia<span class="row-sub">@aliciaa415</span></div>
          </li>
          <li class="row">
            <span class="row-icon">HU</span>
            <div class="row-name">Huabin<span class="row-sub">@123huabin123</span></div>
          </li>
        </ul>
      </div>
    </section>
  </main>
</div>
</body>
</html>
