<!DOCTYPE html>
<!--
  exemple-us19-retirar.html — Maqueta estàtica de US-19 «Retirar de Vacances».
  Basada en base.html (marc 390×844, CSS a ../base.css).

  Estat representat: pantalla de retirada PRE-confirmació amb un import vàlid
  (30,00 € > 0 i ≤ saldo de la guardiola 150,00 €) i el botó «Confirmar»
  actiu (lila #4f46e5), tal com diu el flux (secció 3) i la matriu d'estats
  (secció 4) de l'exemple farcit de docs/us/_plantilla.md.

  Estats NO representats aquí (concerns separats, vegeu la matriu d'estats):
  - Import buit o > 150,00 €: error en vermell i botó desactivat
  - Carregant: «Confirmar» desactivat amb spinner
  - Èxit: tic verd «Has retirat 30,00 € de Vacances» + moviment «−30,00 € Retirada»
-->
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup — US-19 Retirar de Vacances</title>
  <link rel="stylesheet" href="../base.css">
</head>
<body>
  <div class="screen">

    <!-- Barra superior: botó enrere + títol de la pantalla -->
    <div class="appbar">
      <span class="appbar-back">‹</span>
      <span class="appbar-title">Retirar de Vacances</span>
    </div>

    <div class="content">

      <!-- Saldo de la guardiola a dalt (literal de la secció 5: 150,00 €) -->
      <div class="card">
        <div class="section-header">
          <span class="card-title">Saldo de la guardiola</span>
          <span class="badge-owned">Vacances</span>
        </div>
        <div class="balance-big">150,00&nbsp;€</div>
      </div>

      <!-- Camp d'import amb un valor validat (30,00 € > 0 i ≤ 150,00 €) -->
      <form class="card" action="#" method="post">
        <label class="field-label" for="withdrawal-amount">Quants diners vols retirar?</label>
        <div class="field">
          <input id="withdrawal-amount" class="input" type="text" inputmode="decimal"
                 autocomplete="off" value="30,00">
          <span class="muted" aria-hidden="true">€</span>
        </div>
      </form>

      <!-- Acció principal: botó actiu (lila) perquè l'import és vàlid -->
      <div class="actions">
        <a class="btn-primary" href="#">Confirmar</a>
      </div>

    </div>
  </div>
</body>
</html>
