<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enviar · import · F3-Evolt</title>
<style>
:root{
  --color-bg:#f7f9fc;
  --color-surface:#ffffff;
  --color-text:#1a2233;
  --color-muted:#6c7a96;
  --color-border:#e6ebf4;
  --color-primary:#4f46e5;
  --color-income:#16a34a;
  --color-error:#dc2626;
  --radius:0.75rem;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--color-bg);
  color:var(--color-text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
}
/* --- Pantalla 390x844 --- */
.screen{
  width:390px;
  height:844px;
  background:var(--color-bg);
  overflow:hidden;
  margin:0 auto;
  position:relative;
  display:flex;
  flex-direction:column;
}
/* --- Barra superior --- */
.appbar{
  background:var(--color-surface);
  border-bottom:1px solid var(--color-border);
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:8px;
  flex:none;
}
.appbar-title{
  font-size:17px;
  font-weight:600;
}
.appbar-back{
  color:var(--color-muted);
  font-size:20px;
  line-height:1;
}
/* --- Contingut --- */
.content{
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
  flex:1;
}
.card{
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:var(--radius);
  padding:16px;
}
/* <!-- TODO: classe pendent a base.css --> */
.label{
  display:block;
  font-size:13px;
  color:var(--color-muted);
  margin-bottom:6px;
}
/* --- Destinatari --- */
.row{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:56px;
}
.row-icon{
  width:36px;
  height:36px;
  background:#eef0fb;
  color:var(--color-primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:600;
  border-radius:50%;
  flex:none;
}
.row-name{
  flex:1;
  font-size:15px;
  font-weight:500;
}
.row-sub{
  font-size:12px;
  color:var(--color-muted);
  display:block;
  margin-top:2px;
}
/* --- Import gran --- */
/* <!-- TODO: classe pendent a base.css --> */
.amount-display{
  font-size:40px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  line-height:1.2;
  margin-top:2px;
}
/* --- Camp concepte --- */
.field{
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:var(--radius);
  padding:12px 16px;
  font-size:16px;
  color:var(--color-text);
  width:100%;
  font-family:inherit;
}
/* <!-- TODO: classe pendent a base.css --> */
.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
/* <!-- TODO: classe pendent a base.css --> */
.key{
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:var(--radius);
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:600;
  color:var(--color-text);
  font-variant-numeric:tabular-nums;
}
/* <!-- TODO: classe pendent a base.css --> */
.key.key-action{
  color:var(--color-muted);
  font-size:18px;
}
/* --- Botó --- */
.btn-primary{
  background:var(--color-primary);
  color:#fff;
  border-radius:var(--radius);
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:15px;
  font-weight:600;
  border:none;
  width:100%;
  margin-top:4px;
}
</style>
</head>
<body>
<!--
  US-14 · «Enviar diners a usuaris» — maqueta estàtica (entrada d'import amb teclat).

  Estats NO representats aquí:
  - Destinatari 404: «No hem trobat aquest destinatari.»
  - «Continuar» desactivat mentre l'import sigui buit, ≤ 0 o mal format
  - Error de format: «Escriu un import en euros, amb 2 decimals com a màxim.»
  - Error: «L'import ha de ser més gran que 0.»
-->
<div class="screen">
  <header class="appbar">
    <span class="appbar-back" aria-hidden="true">←</span>
    <h1 class="appbar-title" style="margin:0">Enviar</h1>
  </header>
  <main class="content">
    <!-- Destinatari -->
    <div class="card">
      <div class="row">
        <span class="row-icon">UN</span>
        <div class="row-name">Usuari nou<span class="row-sub">@buit</span></div>
      </div>
    </div>
    <!-- Import -->
    <div class="card">
      <span class="label">Import</span>
      <div class="amount-display">20,00&nbsp;€</div>
    </div>
    <!-- Teclat numèric -->
    <div class="keypad">
      <div class="key">1</div><div class="key">2</div><div class="key">3</div>
      <div class="key">4</div><div class="key">5</div><div class="key">6</div>
      <div class="key">7</div><div class="key">8</div><div class="key">9</div>
      <div class="key key-action">,</div><div class="key">0</div><div class="key key-action">⌫</div>
    </div>
    <!-- Concepte -->
    <section>
      <span class="label">Concepte</span>
      <input class="field" type="text" placeholder="Opcional" value="El sopar de divendres">
    </section>
    <button class="btn-primary" type="button">Continuar</button>
  </main>
</div>
</body>
</html>
