<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sol·licituds enviades · F3-Evolt</title>
<style>
:root{
  --color-bg:#f7f9fc;
  --color-surface:#ffffff;
  --color-text:#1a2233;
  --color-muted:#6c7a96;
  --color-border:#e6ebf4;
  --color-primary:#4f46e5;
  --color-error:#dc2626;
  --radius:0.75rem;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--color-bg);
  color:var(--color-text);
  font-size:16px;
  line-height:1.5;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
.phone{
  width:390px;
  min-height:844px;
  margin:0 auto;
  position:relative;
  overflow:hidden;
  background:var(--color-bg);
}
.card{
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:var(--radius);
}
/* Header */
.header{
  background:var(--color-surface);
  border-bottom:1px solid var(--color-border);
  padding:16px;
}
.back{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:var(--color-primary);
  font-size:15px;
  font-weight:500;
  text-decoration:none;
}
.title{
  margin:4px 0 0 0;
  font-size:20px;
  font-weight:600;
  line-height:1.3;
}
/* Content */
.content{
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.btn-primary{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  min-height:48px;
  background:var(--color-primary);
  color:#ffffff;
  font-size:16px;
  font-weight:600;
  font-family:inherit;
  border:none;
  border-radius:var(--radius);
  cursor:pointer;
}
.list{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.row{
  padding:12px 16px;
}
.row-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}
.col-left{
  min-width:0;
}
.name{
  font-size:15px;
  font-weight:500;
  line-height:1.4;
}
.handle{
  font-size:13px;
  color:var(--color-muted);
  line-height:1.3;
}
.concept{
  font-size:13px;
  color:var(--color-muted);
  line-height:1.4;
}
.date{
  font-size:13px;
  color:var(--color-muted);
  line-height:1.4;
}
.col-right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:6px;
  flex-shrink:0;
}
.amount{
  font-size:15px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  line-height:1.4;
}
/* Badges */
.badge{
  display:inline-block;
  border-radius:999px;
  padding:.125rem .5rem;
  font-size:12px;
  font-weight:600;
  line-height:1.4;
}
.pendent{background:#e6ebf4;color:var(--color-text)}
.caducada{background:#f1f4f9;color:var(--color-text);border:1px solid var(--color-border)}
/* Ghost button */
.btn-ghost{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  min-height:44px;
  margin-top:12px;
  background:var(--color-surface);
  color:var(--color-text);
  font-size:15px;
  font-weight:600;
  font-family:inherit;
  border:1px solid var(--color-border);
  border-radius:var(--radius);
  cursor:pointer;
}
</style>
</head>
<body>
<!--
  US-15 · Sol·licituds enviades — maqueta estàtica (estat d'èxit amb 2 sol·licituds: Pendent i Caducada).

  Estats NO mostrats en aquesta maqueta:
  - loading: «Carregant…»
  - empty: «Encara no has enviat cap sol·licitud.» + CTA «Demanar diners»
  - error: «No s'han pogut carregar les sol·licituds.» + botó «Reintentar»
  - Targetes d'èxit (`card success`): «Sol·licitud enviada a Alicia.» / «Sol·licitud cancel·lada.»

  Insignies d'estat reservades a US-16 (sol·licituds rebudes):
  - «Pagada» (verd)
  - «Rebutjada» (vermell)
-->
<div class="phone">
  <header class="header">
    <a class="back" href="#">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Inici
    </a>
    <h1 class="title">Sol·licituds enviades</h1>
  </header>

  <main class="content">
    <button class="btn-primary" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      Demanar diners
    </button>

    <div class="list">
      <!-- Fila 1 · Pendent -->
      <div class="card row">
        <div class="row-top">
          <div class="col-left">
            <div class="name">Alicia</div>
            <div class="handle">@alicia</div>
            <div class="concept">El sopar de divendres</div>
            <div class="date">14 de nov. · 19:30</div>
          </div>
          <div class="col-right">
            <div class="amount">25,00 €</div>
            <span class="badge pendent">Pendent</span>
          </div>
        </div>
        <button class="btn-ghost" type="button">Cancel·lar</button>
      </div>

      <!-- Fila 2 · Caducada -->
      <div class="card row">
        <div class="row-top">
          <div class="col-left">
            <div class="name">Huabin</div>
            <div class="handle">@huabin</div>
            <div class="concept">Pizza del diumenge</div>
            <div class="date">6 de nov. · 21:15</div>
          </div>
          <div class="col-right">
            <div class="amount">42,00 €</div>
            <span class="badge caducada">Caducada</span>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
